services:
  - type: web
    name: quantum-discord-bot
    env: python
    buildCommand: |
      # Node is needed for the KaTeX + MathJax renderer. Without it the bot
      # silently falls back to matplotlib's mathtext, which cannot typeset
      # \begin{aligned} and friends.
      curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.xz | tar -xJ -C /opt
      export PATH=/opt/node-v20.18.0-linux-x64/bin:$PATH
      # Call npm through node explicitly: the npm launcher has a
      # `#!/usr/bin/env node` shebang, so it fails unless node is on PATH.
      node /opt/node-v20.18.0-linux-x64/lib/node_modules/npm/bin/npm-cli.js install --prefix ./render --no-audit --no-fund
      pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: NODE_BINARY
        value: /opt/node-v20.18.0-linux-x64/bin/node
      # The room is in Vietnam, and the bot's hours are the room's hours.
      # Without this the container runs on UTC, and "the small hours" means
      # seven in the morning in Saigon - which is why the bot was quiet all
      # day and nobody could tell why.
      - key: TZ
        value: Asia/Ho_Chi_Minh
      # The proactive half of the bot, written out rather than left to the
      # defaults: a stale value in the dashboard is enough to keep it
      # silent, and silent is the failure nobody notices. No cap, no quiet
      # hours, a minute of silence is enough, and nothing is off for being
      # a day old.
      - key: PROACTIVE_ENABLED
        value: "1"
      - key: PROACTIVE_TICK_SECONDS
        value: "60"
      - key: PROACTIVE_MIN_IDLE_SECONDS
        value: "60"
      - key: PROACTIVE_MIN_GAP_MINUTES
        value: "2"
      - key: PROACTIVE_MAX_PER_DAY
        value: "0"
      - key: PROACTIVE_MAX_IDLE_MINUTES
        value: "0"
      - key: PROACTIVE_QUIET_HOURS
        value: ""
      - key: DISCORD_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: MINIMAX_MODEL
        value: minimaxai/minimax-m3.1-flash
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DAYTONA_API_KEY
        sync: false
      - key: LANGSEARCH_API_KEY
        sync: false
      - key: WOLFRAM_APP_ID
        sync: false
      - key: EMBED_MODEL
        value: nvidia/nemotron-3.5-embed-1b
      - key: KAGGLE_API_TOKEN
        sync: false
